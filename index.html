<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terrace Work — calisthenics map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B1A21; --panel:#102730; --panel-2:#16323D; --line:#1F4552;
    --ink:#E8F1F4; --muted:#7C97A3; --amber:#F0A23C; --teal:#3FC0AE; --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--ground);color:var(--ink);
    font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;
    display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }

  #stage{
    position:relative;flex:0 0 auto;height:47vh;min-height:270px;
    background:radial-gradient(ellipse 70% 55% at 50% 44%, #17323E 0%, var(--ground) 74%);
    touch-action:none;
  }
  #stage canvas{display:block;width:100%;height:100%}

  .masthead{position:absolute;top:12px;left:14px;right:120px;pointer-events:none}
  .masthead h1{
    margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
    font-size:19px;letter-spacing:-.02em;
  }
  .masthead span{color:var(--muted);font-size:12px}

  .controls{position:absolute;top:10px;right:12px;display:flex;gap:7px}
  .ctl{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:999px;font:500 12px/1 "Public Sans",sans-serif;
    padding:8px 13px;cursor:pointer;
  }
  .ctl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
  .zoom .ctl{width:38px;height:38px;padding:0;font-size:17px;line-height:1;display:grid;place-items:center}
  #focusName{
    position:absolute;top:12px;left:14px;right:120px;display:none;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;
    letter-spacing:-.01em;pointer-events:none;
  }
  body.focus .rail{display:none}
  body.focus #stage{height:100vh;flex:1 1 auto}
  body.focus .masthead{display:none}
  body.focus #focusName{display:block}
  .spin-hint{
    position:absolute;bottom:9px;left:0;right:0;text-align:center;
    font-size:11.5px;color:var(--muted);pointer-events:none;transition:opacity .4s;
  }

  #readout{
    flex:0 0 auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--panel);padding:11px 14px 12px;
  }
  #readout h2{
    margin:0 0 3px;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:17px;letter-spacing:-.01em;
  }
  #cue{margin:0;color:var(--muted);font-size:13.5px;max-width:64ch}
  #yours{margin:7px 0 0;font-size:12.5px;color:var(--amber);display:none}
  #yours.on{display:block}
  .swatches{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .sw{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  #filters{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
  #filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;
    font:500 13px/1 "Public Sans",sans-serif;padding:8px 14px;cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  #list{flex:1 1 auto;overflow-y:auto;padding:0 14px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .tier{margin:14px 0 7px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px}
  .ex{
    width:100%;text-align:left;background:var(--panel);border:1px solid transparent;
    border-left:3px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;
    padding:11px 13px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .ex:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .ex[aria-current="true"]{background:var(--panel-2);border-left-color:var(--amber)}
  .ex-name{flex:1 1 auto;font-weight:500}
  .ex-meta{flex:0 0 auto;font-size:12px;color:var(--muted)}
  .ex[aria-current="true"] .ex-meta{color:var(--amber)}

  @media (min-width:820px) and (pointer:fine){
    body{flex-direction:row}
    #stage{flex:1 1 58%;height:100vh}
    .rail{flex:1 1 42%;display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
    #readout{border-top:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div id="stage">
  <div class="masthead">
    <h1>Terrace Work</h1>
    <span>tap a move, watch it, see what it hits</span>
  </div>
  <div id="focusName">Pull-up</div>
  <div class="controls">
    <button class="ctl" id="play">Pause</button>
    <button class="ctl" id="flip">Turn</button>
    <button class="ctl" id="focus">Focus</button>
  </div>
  <div class="zoom">
    <button class="ctl" id="zin" aria-label="Zoom in">+</button>
    <button class="ctl" id="zout" aria-label="Zoom out">&minus;</button>
  </div>
  <div class="spin-hint" id="hint">drag to turn · pinch to zoom</div>
</div>

<div class="rail">
  <div id="readout">
    <h2 id="exName">Pull-up</h2>
    <p id="cue">Full hang at the bottom, chin clean over the bar, no kicking.</p>
    <p id="yours"></p>
    <div class="swatches">
      <span class="sw"><i class="dot" style="background:#F0A23C"></i>doing the work</span>
      <span class="sw"><i class="dot" style="background:#3FC0AE"></i>helping out</span>
    </div>
  </div>
  <div id="filters"></div>
  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================
   1. EXERCISES
   ========================================================== */
const EX = [
  {n:"Push-up", c:"push", t:"now", p:["chest","triceps"], s:["shoulders","abs"],
   cue:"Elbows tucked to about 45°, body in one straight line from head to heels.",
   you:"Your mark: 30 in a set."},
  {n:"Diamond push-up", c:"push", t:"now", p:["triceps"], s:["chest","shoulders"],
   cue:"Hands together under your sternum, thumbs and index fingers making a triangle."},
  {n:"Archer push-up", c:"push", t:"next", p:["chest","triceps"], s:["abs","shoulders"],
   cue:"Wide hands. Bend into one arm while the other stays straight. The road to the one-arm."},
  {n:"Pseudo planche push-up", c:"push", t:"next", p:["shoulders","chest"], s:["abs","forearms"],
   cue:"Hands down by your waist, lean your shoulders forward past your hands. Small range, brutal."},
  {n:"Wall handstand push-up", c:"push", t:"next", p:["shoulders","triceps"], s:["traps","abs"],
   cue:"Chest to the wall, walk up, lower until your head lightly touches the floor."},
  {n:"One-arm push-up", c:"push", t:"goal", p:["chest","triceps"], s:["obliques","abs"],
   cue:"Feet wide, free hand behind your back, stop the hips from twisting open."},

  {n:"Pull-up", c:"pull", t:"now", p:["lats","biceps"], s:["forearms","abs"],
   cue:"Full hang at the bottom, chin clean over the bar, no kicking.",
   you:"Your mark: 11 fresh, and 2 sets of 10. Split these into 3 sets across the session."},
  {n:"Chin-up", c:"pull", t:"now", p:["biceps","lats"], s:["forearms"],
   cue:"Palms facing you. Easier than a pull-up, so use it to add volume once your pull-ups die."},
  {n:"Dead hang", c:"pull", t:"now", p:["forearms","lats"], s:["traps","shoulders"],
   cue:"Just hang, shoulders active, not slumped into the sockets. Time it."},
  {n:"Hanging leg raise", c:"pull", t:"now", p:["abs"], s:["forearms","quads"],
   cue:"Hang still, raise straight legs to the bar without swinging. Your lower abs live here."},
  {n:"Archer pull-up", c:"pull", t:"next", p:["lats","biceps"], s:["abs","forearms"],
   cue:"Wide grip, pull to one hand while the other arm straightens along the bar."},
  {n:"Tuck front lever", c:"pull", t:"goal", p:["lats","abs"], s:["lowerback","biceps"],
   cue:"Hang, pull the bar to your hips, tuck the knees and hold your back flat and horizontal."},

  {n:"Hollow body hold", c:"core", t:"now", p:["abs"], s:["obliques","quads"],
   cue:"Lower back glued to the floor, arms and legs off it. If your back lifts, tuck the knees in."},
  {n:"Side plank", c:"core", t:"now", p:["obliques"], s:["shoulders","glutes"],
   cue:"Stack the feet, push the bottom hip up high, hold both sides evenly."},
  {n:"L-sit", c:"core", t:"next", p:["abs","quads"], s:["triceps","forearms"],
   cue:"Hands planted, push the floor away, lock the knees and lift your legs to parallel."},
  {n:"Dragon flag", c:"core", t:"goal", p:["abs","lowerback"], s:["lats","glutes"],
   cue:"Grip something solid behind your head, stay rigid as a plank and lower from the shoulders."},

  {n:"Bodyweight squat", c:"legs", t:"now", p:["quads","glutes"], s:["calves","lowerback"],
   cue:"All the way down, knees tracking over your toes, drive up through mid-foot."},
  {n:"Calf raise", c:"legs", t:"now", p:["calves"], s:[],
   cue:"Off a step edge, full stretch at the bottom, pause at the top. Single leg once it gets easy."},
  {n:"Bulgarian split squat", c:"legs", t:"next", p:["quads","glutes"], s:["hamstrings","calves"],
   cue:"Rear foot up on a step, drop the back knee straight down. Your best single-leg builder.",
   you:"Skating gives you endurance, not this. Two sessions a week is plenty."},
  {n:"Nordic curl", c:"legs", t:"next", p:["hamstrings"], s:["glutes","lowerback"],
   cue:"Anchor your heels, lower your torso forward as slowly as you can, catch with your hands."},
  {n:"Pistol squat", c:"legs", t:"goal", p:["quads","glutes"], s:["abs","calves"],
   cue:"One leg out front, sit all the way down and stand back up. Hold a doorframe until balance comes."},

  {n:"Handwalk", c:"skill", t:"now", p:["shoulders","abs"], s:["forearms","traps"],
   cue:"Small steps, ribs pulled down, don't let the lower back sag.",
   you:"Your mark: 20 feet. That's already an advanced base to build the handstand on."},
  {n:"Wall handstand hold", c:"skill", t:"now", p:["shoulders","forearms"], s:["traps","abs"],
   cue:"Belly to the wall, walk your feet up, hands close to the base. Hold for time."},
  {n:"Crow pose", c:"skill", t:"next", p:["forearms","shoulders"], s:["abs","triceps"],
   cue:"Knees on the backs of your upper arms, tip forward until your feet float."},
  {n:"Freestanding handstand", c:"skill", t:"goal", p:["shoulders","abs"], s:["forearms","traps"],
   cue:"Balance from the fingertips, not the hips. Kick up into open space and bail sideways."},
  {n:"Tuck back lever", c:"skill", t:"goal", p:["lats","lowerback"], s:["biceps","shoulders"],
   cue:"From a hang, roll backwards through your arms and hold tucked, chest facing the floor."}
];

const CATS = [
  {k:"all",label:"Everything"},{k:"push",label:"Push"},{k:"pull",label:"Pull"},
  {k:"core",label:"Core"},{k:"legs",label:"Legs"},{k:"skill",label:"Skills"}
];
const TIERS = [
  {k:"now",label:"In your routine already"},
  {k:"next",label:"Add these next"},
  {k:"goal",label:"The long game"}
];

/* ==========================================================
   2. POSE HELPERS + ANIMATION DATA
   flex is always "positive = the joint closes the way it should"
   ========================================================== */
const PI = Math.PI, H = PI/2;
const A   = (flex, abd, tw) => [-flex, tw||0, abd||0];   // left shoulder / left hip
const mir = a => [a[0], -a[1], -a[2]];

function sym(o){
  const p = {};
  ["sp","ch","nk","bod"].forEach(k=>{ if(o[k]!=null) p[k]=o[k]; });
  if(o.a){ p.aL=o.a; p.aR=mir(o.a); }
  if(o.e!=null){ p.eL=o.e; p.eR=o.e; }
  if(o.l){ p.lL=o.l; p.lR=mir(o.l); }
  if(o.k!=null){ p.kL=o.k; p.kR=o.k; }
  if(o.f!=null){ p.fL=o.f; p.fR=o.f; }
  return Object.assign(p, o.x||{});
}

"Diamond push-up":{tilt:[["x",H]],yaw:H,prop:"floor",ground:["wL","wR","ftL","ftR"],level:[["wL","wR"],["anL","anR"]],dur:3.0,f:[

  {t:0.44,p:sym({a:A(1.15,-0.10),e:1.78,f:0.95})},
  {t:1,   p:sym({a:A(1.52,-0.16),e:0.10,f:0.95})}]},

"Archer push-up":{tilt:[["x",H]],yaw:H,prop:"floor",ground:["wL","wR","ftL","ftR"],level:[["wL","wR"],["anL","anR"]],dur:4.6,f:[
  {t:0,   p:sym({a:A(1.50,0.72),e:0.05,f:0.95})},
  {t:0.22,p:sym({a:A(1.50,0.72),e:0.05,f:0.95,x:{aL:A(1.00,0.60),eL:1.95}})},
  {t:0.44,p:sym({a:A(1.50,0.72),e:0.05,f:0.95})},
  {t:0.68,p:sym({a:A(1.50,0.72),e:0.05,f:0.95,x:{aR:mir(A(1.00,0.60)),eR:1.95}})},
  {t:1,   p:sym({a:A(1.50,0.72),e:0.05,f:0.95})}]},

"Pseudo planche push-up":{tilt:[["x",H]],yaw:H,prop:"floor",ground:["wL","wR","ftL","ftR"],level:[["wL","wR"],["anL","anR"]],dur:3.2,f:[
  {t:0,   p:sym({a:A(1.90,0.32),e:0.10,f:0.95,sp:-0.06,nk:-0.70})},
  {t:0.46,p:sym({a:A(1.90,0.32),e:1.00,f:0.95,sp:-0.06,nk:-0.70})},
  {t:1,   p:sym({a:A(1.90,0.32),e:0.10,f:0.95,sp:-0.06,nk:-0.70})}]},

"Wall handstand push-up":{tilt:[["x",PI]],yaw:0,prop:"wall",ground:["wL","wR"],dur:3.4,f:[
  {t:0,   p:sym({a:A(0,2.52),e:0.06,sp:-0.10,l:A(0,0.05)})},
  {t:0.46,p:sym({a:A(0,2.18),e:1.55,sp:-0.10,l:A(0,0.05)})},
  {t:1,   p:sym({a:A(0,2.52),e:0.06,sp:-0.10,l:A(0,0.05)})}]},

"One-arm push-up":{tilt:[["x",H]],yaw:H,prop:"floor",ground:["wL","ftL","ftR"],level:[["wL"],["anL","anR"]],dur:3.4,f:[

  {t:0.46,p:sym({l:A(0,0.34),f:0.95,x:{aL:A(1.02,0.12),eL:1.95,aR:mir(A(-0.35,-0.55)),eR:2.30}})},

  {t:0.5, p:sym({a:A(0,2.48),e:0.06,l:A(0.20,0.06),k:0.06,sp:0.30,nk:0.26})},
  {t:1,   p:sym({a:A(0,2.55),e:0.06,l:A(0.28,0.06),k:0.06,sp:0.26,nk:0.22})}]},

  {t:0.5, p:sym({l:A(0,0.04),f:0.55,sp:-0.06,nk:-0.30,x:{aL:A(1.45,0.90),eL:1.50,aR:mir(A(0,-0.30)),eR:0.10}})},

"L-sit":{tilt:[],yaw:0,prop:"floor",ground:["wL","wR"],dur:4.2,f:[
  {t:0,   p:sym({a:A(0,-0.34),e:0.05,l:A(1.58,0.10),k:0.05,sp:0.10})},

/* exact lowest-point support data: ellipsoids by radius, everything else by corners */
function volume(mesh){
  const g = mesh.geometry;
  g.computeBoundingBox(); g.computeBoundingSphere();
  if(g.type === "SphereGeometry"){
    mesh.userData.vol = {r: g.boundingSphere.radius};
  } else {
    const b = g.boundingBox, c = [];
    [b.min.x,b.max.x].forEach(x=>[b.min.y,b.max.y].forEach(y=>[b.min.z,b.max.z].forEach(z=>
      c.push(new THREE.Vector3(x,y,z)))));
    mesh.userData.vol = {corners: c};
  }
}

function skin(mesh, muscle, parent){
  mesh.userData.base = muscle ? COL.bone : COL.neutral;
  mesh.material = new THREE.MeshStandardMaterial({
    color: mesh.userData.base, roughness:0.62, metalness:0.05, emissive:0x000000});
  if(muscle){ (registry[muscle] = registry[muscle] || []).push(mesh); }
  parent.add(mesh);
  volume(mesh); MESHES.push(mesh);
  return mesh;
}
function box(parent,w,h,d,x,y,z,muscle,rot){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d));
  m.position.set(x,y,z); if(rot) m.rotation.set(rot[0]||0,rot[1]||0,rot[2]||0);
  return skin(m,muscle,parent);
}
function ball(parent,r,x,y,z,muscle,sc){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,18,13));
  m.position.set(x,y,z); if(sc) m.scale.set(sc[0],sc[1],sc[2]);
  return skin(m,muscle,parent);
}
function bone(parent,ax,ay,az,bx,by,bz,r,muscle){
  const a=new THREE.Vector3(ax,ay,az), b=new THREE.Vector3(bx,by,bz);
  const d=new THREE.Vector3().subVectors(b,a), len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.9,len,14));
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
  return skin(m,muscle,parent);
}
function joint(parent,x,y,z){
  const g=new THREE.Group(); g.position.set(x,y,z); parent.add(g); return g;
}

/* ==========================================================
   4. POSE APPLICATION
   ========================================================== */
const AX = {x:new THREE.Vector3(1,0,0), y:new THREE.Vector3(0,1,0), z:new THREE.Vector3(0,0,1)};
const _q = new THREE.Quaternion(), _v = new THREE.Vector3();

function setEuler(j, a){ if(j && a) j.rotation.set(a[0], a[1], a[2]); }

const _baseQ = new THREE.Quaternion();

let _pitchAxis = "x";
function setPitch(extra){
  tiltG.quaternion.copy(_baseQ);
  if(extra){ _q.setFromAxisAngle(AX[_pitchAxis], extra); tiltG.quaternion.multiply(_q); }
}

function applyPose(anim, p){
  _baseQ.identity();
  (anim.tilt||[]).forEach(([ax,ang])=>{
    _q.setFromAxisAngle(AX[ax], ang); _baseQ.multiply(_q);
  });
  if(p.bod){ _q.setFromAxisAngle(AX.x, p.bod); _baseQ.multiply(_q); }
  setPitch(0);
  yawG.rotation.y = anim.yaw || 0;

  J.sp.rotation.set(p.sp||0,0,0);
  J.ch.rotation.set(p.ch||0,0,0);
  J.nk.rotation.set(p.nk||0,0,0);
  setEuler(J.shL, p.aL || [0,0,0]);
  setEuler(J.shR, p.aR || [0,0,0]);
  J.elL.rotation.set(-(p.eL||0),0,0);
  J.elR.rotation.set(-(p.eR||0),0,0);
  setEuler(J.lL, p.lL || [0,0,0]);
  setEuler(J.lR, p.lR || [0,0,0]);
  J.knL.rotation.set(p.kL||0,0,0);
  J.knR.rotation.set(p.kR||0,0,0);
  J.anL.rotation.set(p.fL||0,0,0);
  J.anR.rotation.set(p.fR||0,0,0);
}

function localOf(obj){
  obj.getWorldPosition(_v);
  return body.worldToLocal(_v.clone());
}

const _m4 = new THREE.Matrix4(), _bounds = {minY:0, maxY:0, minZ:0, maxZ:0};

/* lowest / highest point of one mesh's actual surface, in body space */
function meshSpan(mesh, inv){
  _m4.multiplyMatrices(inv, mesh.matrixWorld);
  const v = mesh.userData.vol;
  if(v.r){
    _v.set(0,0,0).applyMatrix4(_m4);
    const e = _m4.elements;
    const ry = v.r * Math.hypot(e[1], e[5], e[9]);
    const rz = v.r * Math.hypot(e[2], e[6], e[10]);
    return {lo:_v.y - ry, hi:_v.y + ry, zlo:_v.z - rz, zhi:_v.z + rz};
  }
  let lo=Infinity, hi=-Infinity, zlo=Infinity, zhi=-Infinity;
  for(let i=0;i<v.corners.length;i++){
    _v.copy(v.corners[i]).applyMatrix4(_m4);
    if(_v.y<lo)lo=_v.y; if(_v.y>hi)hi=_v.y;
    if(_v.z<zlo)zlo=_v.z; if(_v.z>zhi)zhi=_v.z;
  }
  return {lo, hi, zlo, zhi};
}

function subtreeMeshes(names){
  const out = [];
  names.forEach(n => J[n].traverse(o => { if(o.isMesh) out.push(o); }));
  return out;
}

function lowestUnder(names, inv){
  let low = Infinity;
  for(let i=0;i<names.length;i++){
    J[names[i]].traverse(o=>{ if(o.isMesh){ const sp = meshSpan(o, inv); if(sp.lo < low) low = sp.lo; } });
  }
  return low;
}

/* pitch the body until both contact groups sit at the same height
   (a push-up is a slope from the hands to the toes, not a flat plank) */
function levelOut(anim, inv){
  const [aN, bN] = anim.level;
  _pitchAxis = anim.levelAxis || "x";
  const gap = p => { setPitch(p); tiltG.updateMatrixWorld(true);
                     return lowestUnder(aN, inv) - lowestUnder(bN, inv); };
  let lo = -1.30, hi = 1.30;
  const dLo = gap(lo), dHi = gap(hi);
  if(dLo * dHi > 0){ setPitch(Math.abs(dLo) < Math.abs(dHi) ? lo : hi);
                     tiltG.updateMatrixWorld(true); return; }
  for(let i=0;i<16;i++){
    const m = (lo + hi)/2;
    ((gap(m) > 0) === (dHi > 0)) ? hi = m : lo = m;
  }
  setPitch((lo + hi)/2); tiltG.updateMatrixWorld(true);
}

/* let the body fall until its lowest surface rests on the floor */
function settle(anim){
  placer.position.set(0,0,0);
  body.updateMatrixWorld(true);
  const inv = _m4.copy(body.matrixWorld).invert().clone();
  if(anim.level) levelOut(anim, inv);

  if(anim.bar){
    const top = Math.max.apply(null, anim.bar.map(k => localOf(J[k]).y));
    placer.position.y = BAR_Y - top;
  } else {
    const set = anim.only ? subtreeMeshes(anim.only) : MESHES;
    let low = Infinity;
    for(let i=0;i<set.length;i++){ const sp = meshSpan(set[i], inv); if(sp.lo < low) low = sp.lo; }
    placer.position.y = FLOOR_Y - low;
  }
  body.updateMatrixWorld(true);

  const all = ["hips","nk","wL","wR","ftL","ftR"].map(k => localOf(J[k]));
  placer.position.x = -all.reduce((a,v)=>a+v.x,0)/all.length;
  placer.position.z = -all.reduce((a,v)=>a+v.z,0)/all.length * 0.6;
  body.updateMatrixWorld(true);

  const inv2 = new THREE.Matrix4().copy(body.matrixWorld).invert();
  let minY=Infinity, maxY=-Infinity, minZ=Infinity, maxZ=-Infinity;
  for(let i=0;i<MESHES.length;i++){
    const sp = meshSpan(MESHES[i], inv2);
    if(sp.lo<minY)minY=sp.lo; if(sp.hi>maxY)maxY=sp.hi;
    if(sp.zlo<minZ)minZ=sp.zlo; if(sp.zhi>maxZ)maxZ=sp.zhi;
  }
  _bounds.minY=minY; _bounds.maxY=maxY; _bounds.minZ=minZ; _bounds.maxZ=maxZ;

  if(anim.prop === "wall") wallM.position.z = minZ - 0.05;
  if(anim.prop === "step"){
    const rear = subtreeMeshes(["anR"]);
    let rl = Infinity, rz = 0;
    for(let i=0;i<rear.length;i++){
      const sp = meshSpan(rear[i], inv2);
      if(sp.lo < rl){ rl = sp.lo; rz = (sp.zlo + sp.zhi)/2; }
    }
    stepM.position.y = rl - 0.225;
    stepM.position.z = rz;
  }
}

function frameCentre(){ return (_bounds.minY + _bounds.maxY) / 2; }

const ease = t => t*t*(3-2*t);
function lerpPose(a, b, u){
  const out = {};
  const keys = new Set(Object.keys(a).concat(Object.keys(b)));
  keys.forEach(k=>{
    const x = a[k], y = b[k];
    if(Array.isArray(x) || Array.isArray(y)){
      const xa = x || [0,0,0], ya = y || [0,0,0];
      out[k] = [0,1,2].map(i => xa[i] + (ya[i]-xa[i])*u);
    } else {
      out[k] = (x||0) + ((y||0)-(x||0))*u;
    }
  });
  return out;
}

function poseAt(anim, phase){
  const f = anim.f;
  let i = 0;
  while(i < f.length-2 && phase > f[i+1].t) i++;
  const a = f[i], b = f[i+1] || f[i];
  const span = Math.max(1e-4, b.t - a.t);
  return lerpPose(a.p, b.p, ease(Math.min(1, Math.max(0, (phase - a.t)/span))));
}

function showProp(name){
  Object.keys(props).forEach(k => props[k].visible = (k === name));
}

/* --- muscle highlight --- */
function paint(ex){
  Object.keys(registry).forEach(k => registry[k].forEach(m=>{
    m.material.color.setHex(m.userData.base); m.material.emissive.setHex(0x000000);
  }));
  if(!ex) return;
  (ex.s||[]).forEach(k => (registry[k]||[]).forEach(m=>{
    m.material.color.setHex(COL.secondary); m.material.emissive.setHex(0x0C2E2A);
  }));
  (ex.p||[]).forEach(k => (registry[k]||[]).forEach(m=>{
    m.material.color.setHex(COL.primary); m.material.emissive.setHex(0x3A2205);
  }));
}

if(typeof globalThis !== "undefined"){
  globalThis.__RIG = {J, ANIM, EX, applyPose, settle, poseAt, localOf, frameCentre, body,
                      scene, camera, FLOOR_Y, BAR_Y, MESHES, meshSpan, _bounds, lowestUnder};
}

/* ==========================================================
   5. BOOT (browser only)
   ========================================================== */
function boot(){
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  const listEl = document.getElementById('list');
  const filtersEl = document.getElementById('filters');
  const nameEl = document.getElementById('exName');
  const cueEl = document.getElementById('cue');
  const yoursEl = document.getElementById('yours');
  const hint = document.getElementById('hint');
  const playBtn = document.getElementById('play');

  let active = EX.find(e=>e.n === "Pull-up");
  let anim = ANIM[active.n];
  let filter = 'all', phase = 0, playing = true, last = performance.now();

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.fov = w/h < 0.85 ? 42 : 32;
    base = w/h < 0.85 ? 5.9 : 6.6;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  let tY = 0.30, cY = 0.30, tX = 0, cX = 0, lx = 0, ly = 0, touched = false;
  let camY = 0.2, base = 6.2, zoom = 1, tZoom = 1;
  const pts = new Map();
  let pinch0 = 0, zoom0 = 1;
  const clampZoom = z => Math.max(0.40, Math.min(2.2, z));
  const spread = ()=>{
    const p = [...pts.values()];
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  };

  stage.addEventListener('pointerdown', e=>{
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    lx = e.clientX; ly = e.clientY;
    if(pts.size === 2){ pinch0 = spread(); zoom0 = tZoom; }
    if(!touched){ touched = true; hint.style.opacity = 0; }
  });
  stage.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size >= 2){
      const d = spread();
      if(pinch0 > 8 && d > 8) tZoom = clampZoom(zoom0 * pinch0 / d);
      return;
    }
    tY += (e.clientX - lx) * 0.011;
    tX = Math.max(-0.5, Math.min(0.5, tX + (e.clientY - ly) * 0.006));
    lx = e.clientX; ly = e.clientY;
  });
  const up = e=>{
    pts.delete(e.pointerId);
    if(pts.size === 1){ const p = [...pts.values()][0]; lx = p.x; ly = p.y; }
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e=>{
    e.preventDefault(); tZoom = clampZoom(tZoom * (1 + e.deltaY * 0.0012));
  }, {passive:false});

  document.getElementById('zin').addEventListener('click', ()=> tZoom = clampZoom(tZoom * 0.82));
  document.getElementById('zout').addEventListener('click', ()=> tZoom = clampZoom(tZoom * 1.22));

  const focusBtn = document.getElementById('focus');
  const focusName = document.getElementById('focusName');
  focusBtn.addEventListener('click', ()=>{
    const on = document.body.classList.toggle('focus');
    focusBtn.textContent = on ? 'Exit' : 'Focus';
    setTimeout(resize, 60);
  });

  document.getElementById('flip').addEventListener('click', ()=>{
    tY += PI;
    if(!touched){ touched = true; hint.style.opacity = 0; }
  });
  playBtn.addEventListener('click', ()=>{
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
  });

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ playing = false; playBtn.textContent = 'Play'; }

  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if(playing) phase = (phase + dt/anim.dur) % 1;
    applyPose(anim, poseAt(anim, phase));
    settle(anim);
    cY += (tY - cY) * 0.11; cX += (tX - cX) * 0.11;
    body.rotation.y = cY; body.rotation.x = cX;
    camY += (frameCentre() - camY) * 0.05;
    zoom += (tZoom - zoom) * 0.15;
    camera.position.set(0, camY + 0.18, base * zoom);
    camera.lookAt(0, camY, 0);
    renderer.render(scene, camera);
  }

  function select(ex){
    active = ex; anim = ANIM[ex.n] || ANIM["Push-up"]; phase = 0;
    nameEl.textContent = ex.n;
    focusName.textContent = ex.n;
    cueEl.textContent = ex.cue;
    if(ex.you){ yoursEl.textContent = ex.you; yoursEl.classList.add('on'); }
    else yoursEl.classList.remove('on');
    showProp(anim.prop);
    paint(ex);
    tY = anim.view != null ? anim.view : 0.30; tX = 0;
    [...listEl.querySelectorAll('.ex')].forEach(b=>
      b.setAttribute('aria-current', b.dataset.name === ex.n));
  }

  function render(){
    listEl.innerHTML = '';
    TIERS.forEach(t=>{
      const items = EX.filter(e=> e.t === t.k && (filter === 'all' || e.c === filter));
      if(!items.length) return;
      const h = document.createElement('div');
      h.className = 'tier'; h.textContent = t.label; listEl.appendChild(h);
      items.forEach(e=>{
        const b = document.createElement('button');
        b.className = 'ex'; b.dataset.name = e.n;
        b.setAttribute('aria-current', e.n === active.n);
        b.innerHTML = '<span class="ex-name"></span><span class="ex-meta"></span>';
        b.querySelector('.ex-name').textContent = e.n;
        b.querySelector('.ex-meta').textContent = e.p.join(' · ');
        b.addEventListener('click', ()=> select(e));
        listEl.appendChild(b);
      });
    });
  }

  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c.label;
    b.setAttribute('aria-pressed', String(c.k === filter));
    b.addEventListener('click', ()=>{
      filter = c.k;
      [...filtersEl.children].forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      render();
    });
    filtersEl.appendChild(b);
  });

  resize(); render(); select(active); requestAnimationFrame(frame);
}

if(typeof window !== "undefined" && typeof document !== "undefined" && document.getElementById){
  boot();
}
</script>
</body>
