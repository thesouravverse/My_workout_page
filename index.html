<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terrace Work — calisthenics map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0B1A21;
    --panel:#102730;
    --panel-2:#16323D;
    --line:#1F4552;
    --bone:#9FB2BC;
    --ink:#E8F1F4;
    --muted:#7C97A3;
    --amber:#F0A23C;
    --teal:#3FC0AE;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Public Sans",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }

  /* ---------- stage ---------- */
  #stage{
    position:relative;
    flex:0 0 auto;
    height:46vh;
    min-height:260px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, #17323E 0%, var(--ground) 72%);
    touch-action:none;
  }
  #stage canvas{display:block;width:100%;height:100%}

  .masthead{
    position:absolute;top:12px;left:14px;right:14px;
    display:flex;align-items:baseline;gap:8px;
    pointer-events:none;
  }
  .masthead h1{
    margin:0;
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-.02em;
  }
  .masthead span{color:var(--muted);font-size:12px}

  .spin-hint{
    position:absolute;bottom:10px;left:0;right:0;
    text-align:center;font-size:11.5px;color:var(--muted);
    pointer-events:none;transition:opacity .4s;
  }

  .flip{
    position:absolute;top:10px;right:12px;
    background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    font:500 12px/1 "Public Sans",sans-serif;
    padding:8px 13px;cursor:pointer;
  }
  .flip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- readout ---------- */
  #readout{
    flex:0 0 auto;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--panel);
    padding:11px 14px 12px;
  }
  #readout h2{
    margin:0 0 3px;
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:17px;letter-spacing:-.01em;
  }
  #cue{margin:0;color:var(--muted);font-size:13.5px;max-width:64ch}
  #yours{
    margin:7px 0 0;font-size:12.5px;color:var(--amber);
    display:none;
  }
  #yours.on{display:block}
  .swatches{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .sw{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* ---------- filters ---------- */
  #filters{
    flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;
    padding:10px 14px;scrollbar-width:none;
  }
  #filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;
    background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;
    font:500 13px/1 "Public Sans",sans-serif;
    padding:8px 14px;cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- list ---------- */
  #list{
    flex:1 1 auto;overflow-y:auto;
    padding:0 14px calc(26px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .tier{
    margin:14px 0 7px;font-size:12px;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:5px;
  }
  .ex{
    width:100%;text-align:left;
    background:var(--panel);border:1px solid transparent;
    border-left:3px solid var(--line);
    border-radius:var(--r);
    color:var(--ink);
    font:inherit;
    padding:11px 13px;margin-bottom:7px;cursor:pointer;
    display:flex;align-items:center;gap:10px;
  }
  .ex:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .ex[aria-current="true"]{
    background:var(--panel-2);border-left-color:var(--amber);
  }
  .ex-name{flex:1 1 auto;font-weight:500}
  .ex-meta{flex:0 0 auto;font-size:12px;color:var(--muted)}
  .ex[aria-current="true"] .ex-meta{color:var(--amber)}

  @media (min-width:820px){
    body{flex-direction:row}
    #stage{flex:1 1 58%;height:100vh}
    .rail{flex:1 1 42%;display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:0}
    #readout{border-top:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="masthead">
    <h1>Terrace Work</h1>
    <span>tap a move, see what it hits</span>
  </div>
  <button class="flip" id="flip">Show back</button>
  <div class="spin-hint" id="hint">drag to turn the body</div>
</div>

<div class="rail">
  <div id="readout">
    <h2 id="exName">Pull-up</h2>
    <p id="cue">Hang with straight arms, pull until your collarbone meets the bar, lower all the way down.</p>
    <p id="yours"></p>
    <div class="swatches">
      <span class="sw"><i class="dot" style="background:#F0A23C"></i>doing the work</span>
      <span class="sw"><i class="dot" style="background:#3FC0AE"></i>helping out</span>
    </div>
  </div>

  <div id="filters"></div>
  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   EXERCISE DATA
   muscle keys: chest shoulders triceps biceps forearms lats
                traps abs obliques lowerback glutes quads
                hamstrings calves
   ============================================================ */
const EX = [
  // ---- PUSH ----
  {n:"Push-up", c:"push", t:"now", p:["chest","triceps"], s:["shoulders","abs"],
   cue:"Elbows tucked to about 45°, body in one straight line from head to heels.",
   you:"Your mark: 30 in a set."},
  {n:"Diamond push-up", c:"push", t:"now", p:["triceps"], s:["chest","shoulders"],
   cue:"Hands together under your sternum, thumbs and index fingers making a triangle."},
  {n:"Archer push-up", c:"push", t:"next", p:["chest","triceps"], s:["abs","shoulders"],
   cue:"Wide hands. Bend into one arm while the other stays straight. This is the road to the one-arm."},
  {n:"Pseudo planche push-up", c:"push", t:"next", p:["shoulders","chest"], s:["abs","forearms"],
   cue:"Hands down by your waist, lean your shoulders forward past your hands. Brutal, small range."},
  {n:"Wall handstand push-up", c:"push", t:"next", p:["shoulders","triceps"], s:["traps","abs"],
   cue:"Chest to the wall, walk up, lower until your head lightly touches the floor."},
  {n:"One-arm push-up", c:"push", t:"goal", p:["chest","triceps"], s:["obliques","abs"],
   cue:"Feet wide, free hand behind your back, stop the hips from twisting open."},

  // ---- PULL ----
  {n:"Pull-up", c:"pull", t:"now", p:["lats","biceps"], s:["forearms","abs"],
   cue:"Full hang at the bottom, chin clean over the bar, no kicking.",
   you:"Your mark: 11 fresh, and 2 sets of 10. Split these into 3 sets across the session."},
  {n:"Chin-up", c:"pull", t:"now", p:["biceps","lats"], s:["forearms"],
   cue:"Palms facing you. Easier than a pull-up, so use it to add volume once your pull-ups die."},
  {n:"Dead hang", c:"pull", t:"now", p:["forearms","lats"], s:["traps","shoulders"],
   cue:"Just hang, shoulders active, not slumped into the sockets. Time it."},
  {n:"Hanging leg raise", c:"pull", t:"now", p:["abs"], s:["forearms","quads"],
   cue:"Hang still, raise straight legs to the bar without swinging. The lower abs you're chasing live here."},
  {n:"Archer pull-up", c:"pull", t:"next", p:["lats","biceps"], s:["abs","forearms"],
   cue:"Wide grip, pull to one hand while the other arm straightens along the bar."},
  {n:"Tuck front lever", c:"pull", t:"goal", p:["lats","abs"], s:["lowerback","biceps"],
   cue:"Hang, pull the bar to your hips, tuck knees and hold your back flat and horizontal."},

  // ---- CORE ----
  {n:"Hollow body hold", c:"core", t:"now", p:["abs"], s:["obliques","quads"],
   cue:"Lower back glued to the floor, arms and legs off it. If your back lifts, tuck your knees in."},
  {n:"Side plank", c:"core", t:"now", p:["obliques"], s:["shoulders","glutes"],
   cue:"Stack the feet, push the bottom hip up high, hold both sides evenly."},
  {n:"L-sit", c:"core", t:"next", p:["abs","quads"], s:["triceps","forearms"],
   cue:"Hands planted, push the floor away, lock your knees and lift your legs to parallel."},
  {n:"Dragon flag", c:"core", t:"goal", p:["abs","lowerback"], s:["lats","glutes"],
   cue:"Grip something solid behind your head, keep the body rigid as a plank and lower from the shoulders."},

  // ---- LEGS ----
  {n:"Bodyweight squat", c:"legs", t:"now", p:["quads","glutes"], s:["calves","lowerback"],
   cue:"All the way down, knees tracking over your toes, drive up through mid-foot."},
  {n:"Bulgarian split squat", c:"legs", t:"next", p:["quads","glutes"], s:["hamstrings","calves"],
   cue:"Rear foot up on a step, drop the back knee straight down. Your best single leg builder.",
   you:"Skating gives you endurance, not this. Two sessions a week is plenty."},
  {n:"Calf raise", c:"legs", t:"now", p:["calves"], s:[],
   cue:"Off a step edge, full stretch at the bottom, pause at the top. Single leg once it gets easy."},
  {n:"Nordic curl", c:"legs", t:"next", p:["hamstrings"], s:["glutes","lowerback"],
   cue:"Anchor your heels, lower your torso forward as slowly as you can, catch with your hands."},
  {n:"Pistol squat", c:"legs", t:"goal", p:["quads","glutes"], s:["abs","calves"],
   cue:"One leg out front, sit all the way down and stand back up. Hold a doorframe until the balance comes."},

  // ---- SKILL ----
  {n:"Handwalk", c:"skill", t:"now", p:["shoulders","abs"], s:["forearms","traps"],
   cue:"Small steps, ribs pulled down, don't let the lower back sag.",
   you:"Your mark: 20 feet. That's already an advanced base to build the handstand on."},
  {n:"Wall handstand hold", c:"skill", t:"now", p:["shoulders","forearms"], s:["traps","abs"],
   cue:"Belly to the wall, walk your feet up, hands close to the base. Hold for time."},
  {n:"Crow pose", c:"skill", t:"next", p:["forearms","shoulders"], s:["abs","triceps"],
   cue:"Knees on the backs of your upper arms, tip forward until your feet float."},
  {n:"Freestanding handstand", c:"skill", t:"goal", p:["shoulders","abs"], s:["forearms","traps"],
   cue:"Balance from the fingertips, not the hips. Kick up into an open space and bail sideways."},
  {n:"Tuck back lever", c:"skill", t:"goal", p:["lats","lowerback"], s:["biceps","shoulders"],
   cue:"From a hang, roll backwards through your arms and hold tucked, chest facing the floor."}
];

const CATS = [
  {k:"all",   label:"Everything"},
  {k:"push",  label:"Push"},
  {k:"pull",  label:"Pull"},
  {k:"core",  label:"Core"},
  {k:"legs",  label:"Legs"},
  {k:"skill", label:"Skills"}
];
const TIERS = [
  {k:"now",  label:"In your routine already"},
  {k:"next", label:"Add these next"},
  {k:"goal", label:"The long game"}
];

/* ============================================================
   3D BODY
   ============================================================ */
const COL = {
  neutral:  0x55707E,
  bone:     0x7E96A3,
  primary:  0xF0A23C,
  secondary:0x3FC0AE
};

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xBFD6E0, 0.55));
const key = new THREE.DirectionalLight(0xFFFFFF, 0.85);
key.position.set(2.5, 4, 3.5); scene.add(key);
const rim = new THREE.DirectionalLight(0x5FD8C6, 0.45);
rim.position.set(-3, 1.5, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xFFC98A, 0.25);
fill.position.set(0, -2, 2); scene.add(fill);

const body = new THREE.Group();
scene.add(body);

const registry = {};           // muscle key -> [mesh]
function tag(mesh, muscle){
  mesh.userData.muscle = muscle || null;
  mesh.userData.base = muscle ? COL.bone : COL.neutral;
  mesh.material = new THREE.MeshStandardMaterial({
    color: mesh.userData.base, roughness:0.62, metalness:0.05,
    emissive:0x000000
  });
  if(muscle){ (registry[muscle] = registry[muscle] || []).push(mesh); }
  body.add(mesh);
  return mesh;
}
function box(w,h,d,x,y,z,muscle,rot){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d));
  m.position.set(x,y,z);
  if(rot) m.rotation.set(rot[0]||0, rot[1]||0, rot[2]||0);
  return tag(m, muscle);
}
function ball(r,x,y,z,muscle,scale){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14));
  m.position.set(x,y,z);
  if(scale) m.scale.set(scale[0],scale[1],scale[2]);
  return tag(m, muscle);
}
function limb(ax,ay,az, bx,by,bz, r, muscle){
  const a = new THREE.Vector3(ax,ay,az), b = new THREE.Vector3(bx,by,bz);
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r*0.88, len, 16));
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  return tag(m, muscle);
}

/* --- head & neck --- */
ball(0.25, 0, 1.60, 0, null);
limb(0,1.40,0, 0,1.50,0, 0.10, null);

/* --- torso core (neutral scaffold) --- */
box(0.60, 0.74, 0.30, 0, 1.02, 0, null);
box(0.52, 0.24, 0.28, 0, 0.55, 0, null);          // pelvis

/* --- front torso --- */
box(0.25, 0.23, 0.07,  0.148, 1.245,  0.155, "chest");
box(0.25, 0.23, 0.07, -0.148, 1.245,  0.155, "chest");
[1.03, 0.90, 0.77].forEach(y=>{
  box(0.12, 0.105, 0.05,  0.075, y,  0.157, "abs");
  box(0.12, 0.105, 0.05, -0.075, y,  0.157, "abs");
});
box(0.08, 0.40, 0.24,  0.305, 0.97, 0.01, "obliques");
box(0.08, 0.40, 0.24, -0.305, 0.97, 0.01, "obliques");

/* --- back torso --- */
box(0.26, 0.15, 0.11,  0.155, 1.345, -0.10, "traps");
box(0.26, 0.15, 0.11, -0.155, 1.345, -0.10, "traps");
box(0.17, 0.44, 0.10,  0.225, 1.09, -0.145, "lats", [0,0,-0.10]);
box(0.17, 0.44, 0.10, -0.225, 1.09, -0.145, "lats", [0,0, 0.10]);
box(0.40, 0.22, 0.07, 0, 0.79, -0.155, "lowerback");
ball(0.15,  0.145, 0.52, -0.16, "glutes", [1,0.95,0.85]);
ball(0.15, -0.145, 0.52, -0.16, "glutes", [1,0.95,0.85]);

/* --- arms (A-pose) --- */
[1,-1].forEach(sx=>{
  ball(0.15, sx*0.39, 1.31, 0, "shoulders");
  limb(sx*0.39,1.28,0,  sx*0.55,0.86,0, 0.095, null);            // upper arm scaffold
  ball(0.105, sx*0.455, 1.10,  0.055, "biceps",  [0.8,1.5,0.8]);
  ball(0.105, sx*0.455, 1.10, -0.055, "triceps", [0.8,1.5,0.8]);
  limb(sx*0.55,0.86,0, sx*0.645,0.40,0, 0.082, "forearms");
  ball(0.078, sx*0.66, 0.335, 0, null);
});

/* --- legs --- */
[1,-1].forEach(sx=>{
  limb(sx*0.165,0.46,0, sx*0.19,-0.12,0, 0.135, null);           // thigh scaffold
  ball(0.115, sx*0.177, 0.19,  0.085, "quads",      [0.95,2.0,0.75]);
  ball(0.115, sx*0.177, 0.19, -0.085, "hamstrings", [0.95,1.9,0.72]);
  ball(0.115, sx*0.19, -0.14, 0, null);                          // knee
  limb(sx*0.19,-0.16,0, sx*0.20,-0.72,0, 0.098, null);           // shin scaffold
  ball(0.09, sx*0.20, -0.33, -0.065, "calves", [0.9,1.7,0.8]);
  box(0.16, 0.09, 0.30, sx*0.20, -0.76, 0.08, null);
});

body.position.y = -0.52;

/* --- highlight --- */
function paint(ex){
  Object.keys(registry).forEach(k=>{
    registry[k].forEach(m=>{
      m.material.color.setHex(m.userData.base);
      m.material.emissive.setHex(0x000000);
    });
  });
  if(!ex) return;
  ex.s.forEach(k=>(registry[k]||[]).forEach(m=>{
    m.material.color.setHex(COL.secondary);
    m.material.emissive.setHex(0x0C2E2A);
  }));
  ex.p.forEach(k=>(registry[k]||[]).forEach(m=>{
    m.material.color.setHex(COL.primary);
    m.material.emissive.setHex(0x3A2205);
  }));
}

/* --- camera / resize --- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w/h < 0.85 ? 40 : 30;
  camera.position.set(0, 0.15, w/h < 0.85 ? 5.2 : 6.0);
  camera.lookAt(0, 0.02, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* --- drag to rotate --- */
let targetY = 0.35, curY = 0.35, targetX = 0, curX = 0;
let dragging = false, lastX = 0, lastY = 0, touched = false;
const hint = document.getElementById('hint');

function down(x,y){ dragging = true; lastX = x; lastY = y;
  if(!touched){ touched = true; hint.style.opacity = 0; } }
function move(x,y){
  if(!dragging) return;
  targetY += (x - lastX) * 0.011;
  targetX += (y - lastY) * 0.006;
  targetX = Math.max(-0.5, Math.min(0.5, targetX));
  lastX = x; lastY = y;
}
function up(){ dragging = false; }

stage.addEventListener('pointerdown', e=>{ stage.setPointerCapture(e.pointerId); down(e.clientX, e.clientY); });
stage.addEventListener('pointermove', e=> move(e.clientX, e.clientY));
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('flip').addEventListener('click', e=>{
  const back = Math.abs(((targetY % (Math.PI*2)) + Math.PI*2) % (Math.PI*2) - Math.PI) < 1.4;
  targetY += Math.PI;
  e.currentTarget.textContent = back ? 'Show back' : 'Show front';
  if(!touched){ touched = true; hint.style.opacity = 0; }
});

function tick(){
  requestAnimationFrame(tick);
  if(!dragging && !reduce) targetY += 0.0016;
  curY += (targetY - curY) * 0.11;
  curX += (targetX - curX) * 0.11;
  body.rotation.y = curY;
  body.rotation.x = curX;
  renderer.render(scene, camera);
}

/* ============================================================
   UI
   ============================================================ */
const listEl = document.getElementById('list');
const filtersEl = document.getElementById('filters');
const nameEl = document.getElementById('exName');
const cueEl = document.getElementById('cue');
const yoursEl = document.getElementById('yours');
let active = EX[6];           // pull-up
let filter = 'all';

CATS.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = c.label;
  b.setAttribute('aria-pressed', c.k === filter);
  b.addEventListener('click', ()=>{
    filter = c.k;
    [...filtersEl.children].forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    render();
  });
  filtersEl.appendChild(b);
});

function select(ex){
  active = ex;
  nameEl.textContent = ex.n;
  cueEl.textContent = ex.cue;
  if(ex.you){ yoursEl.textContent = ex.you; yoursEl.classList.add('on'); }
  else yoursEl.classList.remove('on');
  paint(ex);
  [...listEl.querySelectorAll('.ex')].forEach(b=>{
    b.setAttribute('aria-current', b.dataset.name === ex.n);
  });
}

function render(){
  listEl.innerHTML = '';
  TIERS.forEach(t=>{
    const items = EX.filter(e=> e.t === t.k && (filter === 'all' || e.c === filter));
    if(!items.length) return;
    const h = document.createElement('div');
    h.className = 'tier';
    h.textContent = t.label;
    listEl.appendChild(h);
    items.forEach(e=>{
      const b = document.createElement('button');
      b.className = 'ex';
      b.dataset.name = e.n;
      b.setAttribute('aria-current', e.n === active.n);
      b.innerHTML = '<span class="ex-name"></span><span class="ex-meta"></span>';
      b.querySelector('.ex-name').textContent = e.n;
      b.querySelector('.ex-meta').textContent = e.p.join(' · ');
      b.addEventListener('click', ()=> select(e));
      listEl.appendChild(b);
    });
  });
}

resize();
render();
select(active);
tick();
</script>
</body>
</html>
